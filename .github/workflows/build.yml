name: build
on: [push]
jobs:
  windows-client-display:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install MinGW-w64, CMake and Mesa with MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-mesa
          mingw-w64-x86_64-python
    - name: Configure Windows client with test capture
      run: |
        mkdir client/build
        cd client/build
        cmake -G "MSYS Makefiles" -DENABLE_TESTS=ON -DOPTIMIZE_FOR_NATIVE=OFF ..
    - name: Build Windows client
      run: |
        cd client/build
        make -k -j$(nproc)
    - name: Check a test frame in a Windows window
      run: |
        # the runner has no GPU, so the client uses Mesa's software OpenGL
        cp /mingw64/bin/opengl32.dll client/build/
        GALLIUM_DRIVER=llvmpipe python windows-client/client_smoke_test.py \
          --output smoke client/build/looking-glass-client.exe
    - name: Upload Windows client smoke test output
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: windows-client-smoke
        path: smoke/

