name: build
on: [push, pull_request]
jobs:
  client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - {cc: gcc, cxx: g++}
          - {cc: clang, cxx: clang++}
        wayland_shell: [xdg-shell, libdecor]
        build_type: [Release, Debug]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install client dependencies
      run: |
        sudo apt-get install \
          weston xvfb libgtest-dev libgl1-mesa-dri \
          libdw-dev libunwind-dev \
          libspice-protocol-dev nettle-dev \
          libgl-dev libgles-dev \
          libx11-dev libxss-dev libxi-dev libxinerama-dev libxcursor-dev libxpresent-dev \
          libwayland-dev libxkbcommon-dev \
          libfontconfig-dev libfuse3-dev \
          libsamplerate0-dev libpipewire-0.3-dev libpulse-dev \
          $([ '${{ matrix.wayland_shell }}' = libdecor ] && echo 'libdecor-0-dev libdbus-1-dev') \
          $([ '${{ matrix.compiler.cc }}' = clang ] && echo 'clang-tools')
        sudo pip3 install pyenchant
    - name: Configure client
      env:
        CC: /usr/bin/${{ matrix.compiler.cc }}
        CXX: /usr/bin/${{ matrix.compiler.cxx }}
      run: |
        mkdir client/build
        cd client/build
        cmake \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_LINKER:FILEPATH=/usr/bin/ld \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DENABLE_LIBDECOR=${{ matrix.wayland_shell == 'libdecor' }}  \
          -DENABLE_TESTS=ON \
          -DOPTIMIZE_FOR_NATIVE=OFF \
          ..
    - name: Build client
      run: |
        cd client/build
        make -j$(nproc)
    - name: Run client tests
      id: tests
      run: ctest --test-dir client/build --output-on-failure
    - name: Upload client test failures
      if: failure() && steps.tests.outcome == 'failure'
      uses: actions/upload-artifact@v6
      with:
        name: client-test-failures-${{ matrix.compiler.cc }}-${{ matrix.wayland_shell }}-${{ matrix.build_type }}
        path: |
          client/build/Testing/
          /tmp/lg-render-case.*
    - name: Checking help spelling
      run: ./client/build/looking-glass-client --help | ./doc/lgspell.py
    - name: Check GL function calls
      if: matrix.compiler.cc == 'clang'
      run: WAYLAND_SHELL='${{ matrix.wayland_shell }}' ./gl-check
  module:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Build kernel module
      run: |
        cd module
        make

  host-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install Linux host dependencies
      run: |
        sudo apt-get install libdw-dev libunwind-dev libglib2.0-dev \
          libxcb-xfixes0-dev libpipewire-0.3-dev libxcb-shm0-dev
    - name: Configure Linux host
      run: |
        mkdir host/build
        cd host/build
        cmake ..
    - name: Build Linux host
      run: |
        cd host/build
        make -j$(nproc)

  host-windows-cross:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install Windows host cross-compile dependencies
      run: |
        sudo apt-get install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nsis
    - name: Configure Windows host for cross-compile
      run: |
        mkdir host/build
        cd host/build
        cmake -DCMAKE_TOOLCHAIN_FILE=../toolchain-mingw64.cmake ..
    - name: Cross-compile Windows host
      run: |
        cd host/build
        make -j$(nproc)
    - name: Build Windows host installer
      run: |
        cd host/build
        makensis platform/Windows/installer.nsi
    - name: Build Windows host installer with IVSHMEM drivers
      run: |
        cd host/build
        curl https://dl.quantum2.xyz/ivshmem.tar.gz | tar xz
        makensis -DIVSHMEM platform/Windows/installer.nsi

  host-windows-native:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install NSIS
      shell: powershell
      run: |
        winget install -e --id NSIS.NSIS --silent --accept-source-agreements --accept-package-agreements
        $paths = @(
          (Join-Path ${env:ProgramFiles}      'NSIS\Bin'),
          (Join-Path ${env:ProgramFiles(x86)} 'NSIS\Bin')
        ) | Where-Object { Test-Path $_ }

        if ($paths.Count -eq 0) {
          Write-Error "NSIS 'Bin' folder not found after install."
          exit 1
        }

        $paths | ForEach-Object {
          Add-Content -Path $env:GITHUB_PATH -Value $_
        }

        Write-Host "makensis location(s): $($paths -join ', ')"
    - name: Test NSIS
      run: |
        makensis /VERSION
    - name: Configure Windows host for native MinGW-w64
      run: |
        mkdir host\build
        cd host\build
        cmake -G "MinGW Makefiles" ..
    - name: Build Windows host on native MinGW-w64
      run: |
        cd host\build
        mingw32-make "-j$([Environment]::ProcessorCount)"
    - name: Build Windows host installer
      run: |
        cd host\build
        makensis -DBUILD_32BIT platform\Windows\installer.nsi

  windows-client-cross:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install Windows client cross-compile dependencies
      run: |
        sudo apt-get install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
    - name: Build and test the Windows client loopback on Linux
      run: |
        mkdir windows-client/build-linux
        cd windows-client/build-linux
        cmake ..
        make -j$(nproc)
        ctest --output-on-failure
    - name: Cross-compile the Windows client loopback and the HCS probe
      run: |
        mkdir windows-client/build
        cd windows-client/build
        cmake -DCMAKE_TOOLCHAIN_FILE=../../host/toolchain-mingw64.cmake ..
        make -j$(nproc)
    - name: Check the HCS probe's guest init under QEMU with ivshmem
      run: |
        sudo apt-get install qemu-system-x86
        # Ubuntu's generic kernel, unpacked rather than installed
        mkdir guest-kernel
        cd guest-kernel
        image=$(apt-cache depends linux-image-virtual |
          awk '/Depends: linux-image-[0-9]/ { print $2; exit }')
        apt-get download "${image/linux-image-/linux-image-unsigned-}"
        dpkg-deb -x linux-image-unsigned-*.deb .
        cd ..
        # the serial port opens late, as it may on Hyper-V
        python3 windows-client/hcs_probe_guest_test.py \
          windows-client/build/hcs-probe-guest-init guest-kernel/boot/vmlinuz-* \
          --connect-after 10 --log guest-serial.log
    - name: Upload the guest serial log
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: windows-client-hcs-guest
        path: guest-serial.log
    - name: Cross-compile the Windows client
      run: |
        mkdir client/build-windows
        cd client/build-windows
        cmake -DCMAKE_TOOLCHAIN_FILE=../../host/toolchain-mingw64.cmake \
          -DOPTIMIZE_FOR_NATIVE=OFF ..
        make -j$(nproc)

  windows-client-native:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Configure Windows client for native MinGW-w64
      run: |
        mkdir windows-client\build
        cd windows-client\build
        cmake -G "MinGW Makefiles" ..
    - name: Build Windows client on native MinGW-w64
      run: |
        cd windows-client\build
        mingw32-make "-j$([Environment]::ProcessorCount)"
    - name: Run Windows client tests
      run: |
        cd windows-client\build
        ctest --output-on-failure
    - name: Get WSL's kernel for the HCS probe's VMs
      id: wsl-kernel
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $kernel = "$env:ProgramFiles\WSL\tools\kernel"
        if (-not (Test-Path $kernel)) {
          gh release download --repo microsoft/WSL --pattern "wsl.*.x64.msi" `
            --dir wsl
          $msi = (Get-ChildItem wsl\*.msi | Select-Object -First 1).FullName
          $unpack = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
            "/a `"$msi`" /qn TARGETDIR=`"$PWD\wsl\files`" /lv `"$PWD\wsl\msi.log`""
          if ($unpack.ExitCode -ne 0) {
            Get-Content wsl\msi.log -Tail 40
            exit 1
          }
          $kernel = (Get-ChildItem -Recurse wsl\files -File -Filter kernel |
            Select-Object -First 1).FullName
          if (-not $kernel) {
            Get-ChildItem -Recurse wsl\files -File | Select-Object FullName
            exit 1
          }
          Write-Output "From $msi"
        }
        Get-Item $kernel | Format-List FullName, Length, LastWriteTime
        "kernel=$kernel" >> $env:GITHUB_OUTPUT
    - name: Check shared memory with Hyper-V VMs that boot WSL's kernel
      run: |
        python windows-client\hcs_probe_smoke.py `
          windows-client\build\lg-windows-client-hcs-probe.exe `
          --kernel "${{ steps.wsl-kernel.outputs.kernel }}" --output hcs-probe
    - name: Show the Hyper-V events from the HCS probe's VMs
      if: always()
      run: |
        # what the VM workers say, such as why a VM stopped by itself
        function Show-Events($events, $log) {
          $events | Sort-Object TimeCreated | ForEach-Object {
            $text = "$($_.Message)" -replace '\s+', ' '
            $text = $text.Substring(0, [Math]::Min(500, $text.Length))
            "$($_.TimeCreated.ToString('HH:mm:ss.fff')) $log $($_.Id) " +
              "$($_.LevelDisplayName): $text"
          }
        }
        $since = (Get-Date).AddMinutes(-30)
        Get-WinEvent -ListLog *Hyper-V*, *Hcs* -ErrorAction SilentlyContinue |
          Where-Object RecordCount -gt 0 | ForEach-Object {
            $events = @(Get-WinEvent -LogName $_.LogName -MaxEvents 80 `
              -ErrorAction SilentlyContinue | Where-Object TimeCreated -ge $since)
            Show-Events $events $_.LogName
          }
        # a crash of the worker process shows here
        $crashes = @(Get-WinEvent -ErrorAction SilentlyContinue -FilterHashtable @{
          LogName = 'Application'; StartTime = $since; Level = 1, 2 })
        Show-Events $crashes Application
    - name: Upload the HCS probe's report and serial logs
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: windows-client-hcs-probe
        path: |
          hcs-probe/report.json
          hcs-probe/*.serial.log
        if-no-files-found: ignore

  windows-client-display:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Install MinGW-w64, CMake and Mesa with MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          make
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-mesa
          mingw-w64-x86_64-python
    - name: Configure Windows client with test capture
      run: |
        mkdir client/build
        cd client/build
        cmake -G "MSYS Makefiles" -DENABLE_TESTS=ON -DOPTIMIZE_FOR_NATIVE=OFF ..
    - name: Build Windows client
      run: |
        cd client/build
        make -j$(nproc)
    - name: Build the test frame producer
      run: |
        mkdir windows-client/build
        cd windows-client/build
        cmake -G "MSYS Makefiles" ..
        make -j$(nproc) lg-windows-client-producer
    - name: Check a test frame in a Windows window
      run: |
        # the runner has no GPU, so the client uses Mesa's software OpenGL
        cp /mingw64/bin/opengl32.dll client/build/
        GALLIUM_DRIVER=llvmpipe python windows-client/client_smoke_test.py \
          --output smoke/test client/build/looking-glass-client.exe
    - name: Check a frame from a shared memory section in a Windows window
      run: |
        GALLIUM_DRIVER=llvmpipe python windows-client/client_smoke_test.py \
          --producer windows-client/build/lg-windows-client-producer.exe \
          --output smoke/lgmp client/build/looking-glass-client.exe
    - name: Check that the client refuses a section every account can open
      run: |
        GALLIUM_DRIVER=llvmpipe python windows-client/client_smoke_test.py \
          --producer windows-client/build/lg-windows-client-producer.exe \
          --world --output smoke/world client/build/looking-glass-client.exe
    - name: Upload Windows client smoke test output
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: windows-client-smoke
        path: smoke/

  idd:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    - name: Install NuGet packages
      run: |
        cd idd
        nuget restore LGIdd.sln
    - name: Build IDD
      run: |
        cd idd
        msbuild.exe LGIdd.sln /t:Build /p:Configuration=Release /p:Platform=x64
    - name: Build NSIS Installer
      run: |
        cd idd\x64\Release\LGIdd
        makensis -DBUILD_32BIT installer.nsi
    - name: Build NSIS installer with IVSHMEM drivers
      run: |
        cd idd\x64\Release
        Invoke-WebRequest https://dl.quantum2.xyz/ivshmem.tar.gz -OutFile ivshmem.tar.gz
        tar -xzvf ivshmem.tar.gz
        cd LGIdd
        makensis -DBUILD_32BIT -DIVSHMEM installer.nsi

  obs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install obs plugin dependencies
      run: |
        sudo apt-get install libdw-dev libunwind-dev libobs-dev libgl1-mesa-dev
    - name: Configure obs plugin
      run: |
        mkdir obs/build
        cd obs/build
        CC=/usr/bin/${{ matrix.cc }} cmake \
          -DOPTIMIZE_FOR_NATIVE=OFF \
          ..
    - name: Build obs plugin
      run: |
        cd obs/build
        make -j$(nproc)

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Update apt
      run: |
        sudo apt-get update
    - name: Install docs dependencies
      run: |
        sudo apt-get install python3-sphinx python3-sphinx-rtd-theme \
            python3-sphinxcontrib.spelling
    - name: Build docs
      run: |
        cd doc
        make dirhtml SPHINXOPTS='-b spelling -W' -j$(nproc)
