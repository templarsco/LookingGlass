name: windows-client-release

# Publishes an experimental Windows client build of this fork as a GitHub
# pre-release. Pull requests that touch the packaging only build and check
# the archives.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to create, such as limiar-windows-v0.1.0'
        required: true
  push:
    tags:
      - 'limiar-windows-v*'
  pull_request:
    paths:
      - '.github/workflows/windows-client-release.yml'
      - 'windows-client/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
    - name: Choose the version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        case "$GITHUB_EVENT_NAME" in
          workflow_dispatch) version="$INPUT_VERSION" ;;
          push)              version="$GITHUB_REF_NAME" ;;
          *)                 version="limiar-windows-v0.0.0-ci.${GITHUB_SHA::10}" ;;
        esac
        if ! [[ "$version" =~ ^limiar-windows-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
          echo "Invalid version: $version"
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Install the MinGW-w64 cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
        # the win32 thread model, which links no winpthreads
        sudo update-alternatives --set x86_64-w64-mingw32-gcc \
          /usr/bin/x86_64-w64-mingw32-gcc-win32
        sudo update-alternatives --set x86_64-w64-mingw32-g++ \
          /usr/bin/x86_64-w64-mingw32-g++-win32
    - name: Cross-compile the Windows client
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "$VERSION" > VERSION
        mkdir client/build-windows
        cd client/build-windows
        # ENABLE_TESTS adds the framebuffer capture that the smoke test uses
        cmake -DCMAKE_TOOLCHAIN_FILE=../../host/toolchain-mingw64.cmake \
          -DCMAKE_BUILD_TYPE=Release -DENABLE_TESTS=ON \
          -DOPTIMIZE_FOR_NATIVE=OFF ..
        make -j$(nproc)
    - name: Package the Windows client and its source
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
        python3 windows-client/package.py \
          client/build-windows/looking-glass-client.exe \
          --version "$VERSION" --commit "$GITHUB_SHA" --output dist \
          --notice mingw-w64-runtime=/usr/share/doc/mingw-w64-x86-64-dev/copyright \
          --notice gcc-runtime=/usr/share/doc/gcc-mingw-w64-x86-64-win32/copyright

        # the complete source of the build, including every submodule
        name="looking-glass-$VERSION"
        { git ls-files --recurse-submodules; echo VERSION; } | \
          tar --create --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner \
            --transform="flags=r;s,^,$name/," --files-from=- | \
          gzip -n > "dist/$name-source.tar.gz"
        ls -l dist
    - uses: actions/upload-artifact@v6
      with:
        name: windows-client-release
        path: dist/
        if-no-files-found: error

  smoke:
    needs: build
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/download-artifact@v6
      with:
        name: windows-client-release
        path: dist
    - name: Install Mesa and Python with MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >-
          unzip
          mingw-w64-x86_64-mesa
          mingw-w64-x86_64-python
    - name: Check a test frame with the packaged client
      run: |
        unzip -q dist/looking-glass-client-*-windows-x64.zip -d unpacked
        client=$(echo unpacked/*/looking-glass-client.exe)
        # the runner has no GPU, so the client uses Mesa's software OpenGL
        cp /mingw64/bin/opengl32.dll "$(dirname "$client")/"
        GALLIUM_DRIVER=llvmpipe python windows-client/client_smoke_test.py \
          --output smoke "$(cygpath -w "$client")"
    - name: Upload the smoke test output
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: windows-client-release-smoke
        path: smoke/

  publish:
    needs: [build, smoke]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v6
      with:
        name: windows-client-release
        path: dist
    - name: Publish the pre-release
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        cd dist
        sha256sum looking-glass-* > SHA256SUMS
        cat SHA256SUMS
        gh release create "$VERSION" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "Windows client $VERSION (experimental, unofficial)" \
          --notes-file release-notes.md \
          --prerelease \
          looking-glass-* SHA256SUMS
